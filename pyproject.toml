[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-bt"
version = "0.1.0"
description = "Python client library for Flow 2 air quality monitors via Bluetooth Low Energy"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "James Hayes", email = "jamesmcmahon0@gmail.com"}
]

dependencies = [
    "bleak>=0.19.0",
]

[project.scripts]
flow-bt = "flow_bt.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]